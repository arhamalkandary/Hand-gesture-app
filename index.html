<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hand Gesture Recognition</title>
  <link rel="stylesheet" href="style.css">
  
  <!-- Memuat pustaka MediaPipe Hands langsung dari CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="container">
    <h1>Deteksi Gestur Tangan</h1>
    
    <div class="video-wrapper">
      <video id="webcam" autoplay playsinline></video>
      <!-- Kanvas untuk menggambar titik sendi tangan -->
      <canvas id="output-canvas"></canvas>
      <div id="output-text" class="status-overlay">Memuat Model AI...</div>
    </div>

    <button id="btn-start">Aktifkan Kamera</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
